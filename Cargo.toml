[package]
name = "suitcase"
description = "A set of personal CLI tools to automate common tasks in software development (including Rust, Dart, and Flutter), written in Rust."
version = "0.1.5"
edition = "2021"
repository = "https://github.com/jeroen-meijer/suitcase-rs"
categories = ["command-line-utilities"]
license-file = "LICENSE"
default-run = "suitcase"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
colored = "3.0.0"
env_logger = "0.11.8"
log = "0.4.27"
serde = "1.0.219"
serde_yaml = "0.9.34"
spinners = "4.1.1"
thiserror = "2.0.12"
